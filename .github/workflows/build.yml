name: build

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Build and Verify
        env:
          # Mocha 9 imports .ts tests when Node strips types, and @oclif/test
          # then crashes because module.parent is unset. Keep the ts-node require path.
          NODE_OPTIONS: --no-experimental-strip-types
        run: |
          yarn install --frozen-lockfile
          yarn build
          yarn test
