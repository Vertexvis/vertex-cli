name: build

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 18.x
      - name: Build and Verify
        run: |
          yarn install --frozen-lockfile
          yarn build
          yarn test
